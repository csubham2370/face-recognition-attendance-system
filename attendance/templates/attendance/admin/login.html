{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Login | Face Attendance</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-body-tertiary">
    <main
      class="container min-vh-100 d-flex align-items-center justify-content-center py-5"
    >
      <div class="row justify-content-center w-100">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
          <div class="card border-0 shadow">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <h1 class="h3 fw-bold mb-2">Admin Login</h1>
                <p class="text-body-secondary mb-0">
                  Sign in to manage face attendance.</p>
              </div>
              <div id="messageBox" class="alert d-none" role="alert" aria-live="polite"></div>
              <form id="adminLoginForm" data-url="{% url 'attendance:admin_login' %}" novalidate>
                {% csrf_token %}
                <div class="row g-3 mb-4">
                  <div class="col-12">
                    <label for="username" class="form-label fw-semibold">Username</label>
                    <input type="text" id="username" name="username" class="form-control form-control-lg" placeholder="Enter username" autocomplete="username" required autofocus />
                  </div>
                  <div class="col-12">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password" id="password" name="password" class="form-control form-control-lg" placeholder="Enter password" autocomplete="current-password" required />
                  </div>
                </div>
                <button type="submit" id="loginButton" class="btn btn-primary btn-lg w-100">Login</button>
                <div class="text-center mt-3">
                  <a href="{% url 'attendance:forgot_password' %}">Forgot Password?</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="{% static 'attendance/js/notification_timeout.js' %}"></script>
    <script src="{% static 'attendance/js/admin_login.js' %}"></script>
  </body>
</html>
