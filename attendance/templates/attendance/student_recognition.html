{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Student Recognition</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <style>
        .student-recognition-row {
            width: 80%;
            margin-left: auto;
            margin-right: auto;
        }

        .student-camera-frame {
            width: 80%;
            aspect-ratio: 4 / 3;
            margin-left: auto;
            margin-right: auto;
            overflow: hidden;
            border-radius: var(--bs-border-radius);
            background: #000;
        }

        .student-camera-frame #video,
        .student-camera-frame #canvas,
        .student-camera-frame #cameraOffMessage {
            width: 100% !important;
            height: 100%;
            object-fit: cover;
        }

    </style>
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="text-center mb-4">

        <h2>
            Student Face Recognition
        </h2>

        <p class="text-muted">
            Look at the camera and mark your attendance.
        </p>

    </div>


    <div class="row justify-content-center student-recognition-row">

        <div class="col-md-7">

            <div class="card shadow-sm">

                <div class="card-body">

                    <div class="student-camera-frame">
                        <video id="video" width="100%" class="rounded bg-dark" autoplay playsinline></video>
                        <canvas id="canvas" class="d-none rounded w-100"></canvas>
                        <div id="cameraOffMessage" class="d-none bg-success-subtle text-success text-center rounded py-5">
                            <div class="fs-4 fw-semibold">Attendance Completed</div>
                            <div>Camera turned off automatically.</div>
                        </div>
                    </div>

                    <button type="button" id="recognizeButton" class="btn btn-primary w-100 mt-3" data-url="{% url 'attendance:student_recognize_face' %}" disabled>
                        Recognize Face
                    </button>

                    <div id="recognitionMessage" class="mt-3 alert alert-secondary" aria-live="polite">
                        Starting camera…
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
<div
    class="modal fade"
    id="attendanceSuccessModal"
    tabindex="-1"
    aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Attendance Successful
                </h5>

            </div>

            <div class="modal-body text-center">

                <h4 class="text-success">
                    Your attendance is successful.
                </h4>

                <div
                    id="successStudentDetails"
                    class="mt-3"
                >
                </div>

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-success"
                    data-bs-dismiss="modal"
                >
                    OK
                </button>

            </div>

        </div>

    </div>
</div>

<form id="csrfForm">
    {% csrf_token %}
</form>
<div id="studentAttendanceConfig" data-open="{{ attendance_is_open|yesno:'true,false' }}" class="d-none"></div>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="{% static 'attendance/js/notification_timeout.js' %}"></script>
<script src="{% static 'attendance/js/student_recognition.js' %}?v=2"></script>

</body>

</html>
