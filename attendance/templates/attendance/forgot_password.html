{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Forgot Password</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container min-vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow border-0" style="width: 420px;">

        <div class="card-body p-4">

            <h3 class="text-center mb-4">Forgot Password</h3>

            <div id="forgotPasswordMessage" class="d-none"></div>

            <form id="forgotPasswordForm" data-url="{% url 'attendance:forgot_password' %}">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label"> Email</label>

                    <input type="email" id="email" name="email" class="form-control" placeholder="Enter admin email" autocomplete="email" required>

                </div>

                <button type="submit" id="forgotPasswordButton" class="btn btn-primary w-100">Send Reset Link</button>

            </form>


            <div class="text-center mt-3">

                <a href="{% url 'attendance:admin_login' %}">Back to Login</a>

            </div>

        </div>

    </div>

</div>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="{% static 'attendance/js/notification_timeout.js' %}"></script>
<script src="{% static 'attendance/js/forgot_password.js' %}"></script>

</body>
</html>
