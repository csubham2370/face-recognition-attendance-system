{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container min-vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow border-0" style="width: 420px;">
        <div class="card-body p-4">
            <h3 class="text-center mb-4">Reset Password</h3>
            <div id="resetPasswordMessage" class="{% if token_is_valid %}d-none{% else %}alert alert-danger{% endif %}">
                {% if not token_is_valid %}This reset link is invalid or has expired.{% endif %}
            </div>

            {% if token_is_valid %}
            <form id="resetPasswordForm">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="password" class="form-label">New password</label>
                    <input type="password" id="password" name="password" class="form-control" minlength="8" required>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm password</label>
                    <input type="password" id="confirmPassword" name="confirm_password" class="form-control" minlength="8" required>
                </div>
                <button type="submit" id="resetPasswordButton" class="btn btn-primary w-100">Reset Password</button>
            </form>
            {% endif %}

            <div class="text-center mt-3">
                <a href="{% url 'attendance:admin_login' %}">Back to Login</a>
            </div>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'attendance/js/notification_timeout.js' %}"></script>
{% if token_is_valid %}<script src="{% static 'attendance/js/reset_password.js' %}"></script>{% endif %}
</body>
</html>
